<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="20" y="26" font-size="14" font-weight="700" fill="#111">C4 nível 3: componentes internos de main.go (437 linhas, pacote main, zero interfaces)</text>

  <text x="20" y="62" font-size="11" font-weight="700" fill="#888">BORDA HTTP</text>
  <line x1="20" y1="70" x2="880" y2="70" stroke="#ddd"/>
  <text x="20" y="232" font-size="11" font-weight="700" fill="#888">REGRA E INFRAESTRUTURA MISTURADAS</text>
  <line x1="20" y1="240" x2="880" y2="240" stroke="#ddd"/>
  <text x="20" y="422" font-size="11" font-weight="700" fill="#888">APRESENTAÇÃO</text>
  <line x1="20" y1="430" x2="880" y2="430" stroke="#ddd"/>

  <rect x="20" y="82" width="200" height="66" rx="5" fill="#eef3ff" stroke="#2c5aa0"/>
  <text x="120" y="104" font-size="12" font-weight="600" text-anchor="middle">main() · L30</text>
  <text x="120" y="121" font-size="10" text-anchor="middle" fill="#445">rotas + CORS inline</text>
  <text x="120" y="136" font-size="10" text-anchor="middle" fill="#445">sem middleware de auth</text>

  <rect x="238" y="82" width="200" height="66" rx="5" fill="#ffe8e8" stroke="#c0392b"/>
  <text x="338" y="104" font-size="12" font-weight="600" text-anchor="middle">handleVideoUpload() · L75</text>
  <text x="338" y="121" font-size="10" text-anchor="middle" fill="#633">HTTP + I/O + orquestração</text>
  <text x="338" y="136" font-size="10" text-anchor="middle" fill="#633">4 responsabilidades</text>

  <rect x="456" y="82" width="196" height="66" rx="5" fill="#eef3ff" stroke="#2c5aa0"/>
  <text x="554" y="104" font-size="12" font-weight="600" text-anchor="middle">handleDownload() · L236</text>
  <text x="554" y="121" font-size="10" text-anchor="middle" fill="#445">serve ZIP sem dono</text>
  <text x="554" y="136" font-size="10" text-anchor="middle" fill="#445">nenhuma verificação</text>

  <rect x="670" y="82" width="210" height="66" rx="5" fill="#ffe8e8" stroke="#c0392b"/>
  <text x="775" y="104" font-size="12" font-weight="600" text-anchor="middle">handleStatus() · L253</text>
  <text x="775" y="121" font-size="10" text-anchor="middle" fill="#633">Glob("outputs/*.zip")</text>
  <text x="775" y="136" font-size="10" text-anchor="middle" fill="#633">inventário global, não status</text>

  <rect x="20" y="162" width="200" height="56" rx="5" fill="#eaf7ea" stroke="#2e7d32"/>
  <text x="120" y="184" font-size="12" font-weight="600" text-anchor="middle">isValidVideoFile() · L281</text>
  <text x="120" y="202" font-size="10" text-anchor="middle" fill="#2e7d32">testável · só valida extensão</text>

  <rect x="238" y="162" width="200" height="56" rx="5" fill="#eaf7ea" stroke="#2e7d32"/>
  <text x="338" y="184" font-size="12" font-weight="600" text-anchor="middle">createDirs() · L68</text>
  <text x="338" y="202" font-size="10" text-anchor="middle" fill="#2e7d32">idempotente</text>

  <rect x="20" y="252" width="418" height="120" rx="5" fill="#ffd9d9" stroke="#8b0000" stroke-width="1.6"/>
  <text x="229" y="276" font-size="13" font-weight="700" text-anchor="middle" fill="#6b0000">processVideo() · L126, hotspot</text>
  <text x="229" y="296" font-size="10.5" text-anchor="middle" fill="#5a1010">timestamp de 1 s como identidade do job</text>
  <text x="229" y="313" font-size="10.5" text-anchor="middle" fill="#5a1010">exec.Command("ffmpeg") sem timeout nem context</text>
  <text x="229" y="330" font-size="10.5" text-anchor="middle" fill="#5a1010">Glob no diretório compartilhado, daí a contaminação</text>
  <text x="229" y="347" font-size="10.5" text-anchor="middle" fill="#5a1010">defer os.RemoveAll() apaga pasta de outro request</text>
  <text x="229" y="364" font-size="10.5" text-anchor="middle" fill="#5a1010">fmt.Printf como observabilidade</text>

  <rect x="456" y="252" width="196" height="120" rx="5" fill="#eaf7ea" stroke="#2e7d32"/>
  <text x="554" y="276" font-size="12" font-weight="600" text-anchor="middle">createZipFile() · L187</text>
  <text x="554" y="296" font-size="10" text-anchor="middle" fill="#2e7d32">recebe lista de arquivos</text>
  <text x="554" y="313" font-size="10" text-anchor="middle" fill="#2e7d32">erro propagado corretamente</text>
  <text x="554" y="330" font-size="10" text-anchor="middle" fill="#2e7d32">sem streaming: abre tudo</text>
  <text x="554" y="352" font-size="10" text-anchor="middle" fill="#555">chama addFileToZip() · L207</text>

  <rect x="670" y="252" width="210" height="120" rx="5" fill="#fff6e5" stroke="#b8860b"/>
  <text x="775" y="276" font-size="12" font-weight="600" text-anchor="middle">Acoplamentos implícitos</text>
  <text x="775" y="296" font-size="10" text-anchor="middle" fill="#7a5a00">caminhos relativos hardcoded</text>
  <text x="775" y="313" font-size="10" text-anchor="middle" fill="#7a5a00">"uploads" "temp" "outputs"</text>
  <text x="775" y="330" font-size="10" text-anchor="middle" fill="#7a5a00">fps=1 fixo no código</text>
  <text x="775" y="352" font-size="10" text-anchor="middle" fill="#7a5a00">porta 8080 fixa · zero env vars</text>

  <rect x="20" y="442" width="860" height="66" rx="5" fill="#f0f0f5" stroke="#555"/>
  <text x="450" y="464" font-size="12.5" font-weight="600" text-anchor="middle">getHTMLForm() · L293: 144 linhas de HTML + CSS + JavaScript dentro de uma string Go (33% do arquivo)</text>
  <text x="450" y="484" font-size="10.5" text-anchor="middle" fill="#444">Front-end versionado junto com o back-end · sem build, lint, minificação ou cache · qualquer ajuste de CSS exige recompilar e redeployar a API</text>
  <text x="450" y="500" font-size="10.5" text-anchor="middle" fill="#444">Consequência: não há como escalar ou publicar a interface separadamente do processamento</text>

  <rect x="20" y="524" width="14" height="14" fill="#eaf7ea" stroke="#2e7d32"/>
  <text x="40" y="535" font-size="10.5" fill="#333">coeso e testável isoladamente</text>
  <rect x="230" y="524" width="14" height="14" fill="#ffe8e8" stroke="#c0392b"/>
  <text x="250" y="535" font-size="10.5" fill="#333">responsabilidades misturadas</text>
  <rect x="450" y="524" width="14" height="14" fill="#ffd9d9" stroke="#8b0000"/>
  <text x="470" y="535" font-size="10.5" fill="#333">hotspot: origem dos defeitos observados</text>
  <rect x="720" y="524" width="14" height="14" fill="#eef3ff" stroke="#2c5aa0"/>
  <text x="740" y="535" font-size="10.5" fill="#333">borda HTTP</text>
</svg>
