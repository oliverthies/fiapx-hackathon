name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: unit tests
        run: go test -cover ./internal/domain/ ./internal/application/ ./internal/adapter/postgres/ ./internal/adapter/fs/ ./internal/adapter/s3store/ ./internal/adapter/wiring/ ./internal/adapter/ffmpeg/ ./internal/adapter/gstreamer/ ./internal/adapter/processor/
      - name: domain has no adapter imports
        run: |
          if grep -R --include='*.go' -E 'chi|amqp|os/exec|pgx|gin' internal/domain internal/application; then
            echo "domain/application must not import infrastructure"
            exit 1
          fi
