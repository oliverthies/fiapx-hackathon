global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]

  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9090
        refresh_interval: 10s

  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
