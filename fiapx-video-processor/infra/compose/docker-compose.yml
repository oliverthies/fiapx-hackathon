services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fiapx
      POSTGRES_PASSWORD: fiapx
      POSTGRES_DB: fiapx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiapx"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  init-storage:
    image: alpine:3.20
    user: "0:0"
    volumes:
      - mediadata:/data
    command: sh -c "mkdir -p /data/uploads /data/outputs /data/temp /data/thumbs && chown -R 10001:10001 /data"

  api:
    build:
      context: ../..
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://fiapx:fiapx@postgres:5432/fiapx?sslmode=disable
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      SMTP_ADDR: mailhog:1025
      JWT_SECRET: dev-secret-change-me
      STORAGE_DRIVER: fs
      STORAGE_ROOT: /data
      HTTP_ADDR: :8080
    ports:
      - "8081:8080"
    restart: unless-stopped
    volumes:
      - mediadata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      init-storage:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgres://fiapx:fiapx@postgres:5432/fiapx?sslmode=disable
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      SMTP_ADDR: mailhog:1025
      STORAGE_DRIVER: fs
      STORAGE_ROOT: /data
      PROCESSOR_DRIVER: ffmpeg
      PROCESSOR_BIN: ffmpeg
      GSTREAMER_BIN: gst-launch-1.0
      METRICS_ADDR: :9090
    volumes:
      - mediadata:/data
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      init-storage:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    # Para dois workers: docker compose up --scale worker=2

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
      - worker
      - rabbitmq

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  mediadata:
