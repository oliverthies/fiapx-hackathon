  <text x="592" y="104" font-size="10" font-weight="700" text-anchor="middle" fill="#8b0000">475,66%</text>
  <line x1="592" y1="106" x2="592" y2="110" stroke="#8b0000"/>

  <text x="160" y="322" font-size="9.5" text-anchor="middle" fill="#666">12 s</text>
  <text x="215" y="322" font-size="9.5" text-anchor="middle" fill="#666">40 s</text>
  <text x="345" y="322" font-size="9.5" text-anchor="middle" fill="#666">120 s</text>
  <text x="600" y="322" font-size="9.5" text-anchor="middle" fill="#666">480 s (483 frames)</text>
  <text x="825" y="322" font-size="9.5" text-anchor="middle" fill="#666">ZIP</text>

  <rect x="66" y="336" width="812" height="52" rx="4" fill="#fafafa" stroke="#bbb"/>
  <text x="80" y="354" font-size="10.5" font-weight="700" fill="#333">Um único upload consome cerca de 79% da máquina.</text>
  <text x="80" y="368" font-size="10.5" fill="#333">O FFmpeg abre até 29 threads (os PIDs do container sobem de 24 para 53) e a memória vai de 291 MB para 607 MB num só job. Depois do FFmpeg, a compactação fica presa em ~100%, um núcleo, porque archive/zip é sequencial.</text>
  <text x="80" y="383" font-size="10" fill="#666">Consequência: mesmo sem a corrida de diretório, não existe folga de CPU para processar dois vídeos longos ao mesmo tempo nesta instância.</text>

  <rect x="700" y="42" width="12" height="10" fill="#c0392b"/>
  <text x="718" y="51" font-size="10" fill="#333">FFmpeg (multithread)</text>
  <rect x="830" y="42" width="12" height="10" fill="#2e7d32"/>
  <text x="848" y="51" font-size="10" fill="#333">ZIP</text>
</svg>
