name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fiapx-video-processor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: unit tests
        run: go test -cover ./internal/domain/ ./internal/application/
      - name: domain has no adapter imports
        run: |
          if grep -R --include='*.go' -nE '^[[:space:]]*(_|[[:alnum:]]+)?[[:space:]]*"(os/exec|github.com/go-chi/|github.com/rabbitmq/amqp|github.com/jackc/pgx|github.com/gin-gonic/|github.com/prometheus/)' internal/domain internal/application; then
            echo "domain/application must not import infrastructure"
            exit 1
          fi
