<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="20" y="26" font-size="14" font-weight="700" fill="#111">Estilo interno: Clean Architecture (referencia do curso) versus o que o baseline implementa</text>
  <text x="20" y="44" font-size="11" fill="#666">A unidade de deploy e monolitica nos dois lados. A diferenca e a existencia de fronteiras internas e a direcao das dependencias.</text>

  <text x="225" y="78" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f4e79">Referencia: Clean / camadas / hexagonal</text>
  <text x="675" y="78" font-size="12.5" font-weight="700" text-anchor="middle" fill="#8b0000">Baseline FIAP X (main.go)</text>

  <!-- left onion-ish stacked layers -->
  <rect x="40" y="96" width="370" height="52" rx="4" fill="#eef3ff" stroke="#2c5aa0"/>
  <text x="225" y="116" font-size="12" font-weight="600" text-anchor="middle">Apresentacao / inbound adapter</text>
  <text x="225" y="134" font-size="10" text-anchor="middle" fill="#445">HTTP, HTML, controllers. Depende da aplicacao</text>

  <rect x="40" y="156" width="370" height="52" rx="4" fill="#e8f0e8" stroke="#2e7d32"/>
  <text x="225" y="176" font-size="12" font-weight="600" text-anchor="middle">Aplicacao (casos de uso)</text>
  <text x="225" y="194" font-size="10" text-anchor="middle" fill="#2e5e2e">orquestra; depende de portas, nao de FFmpeg</text>

  <rect x="40" y="216" width="370" height="62" rx="4" fill="#fff6e5" stroke="#b8860b"/>
  <text x="225" y="240" font-size="12" font-weight="600" text-anchor="middle">Dominio (nucleo)</text>
  <text x="225" y="258" font-size="10" text-anchor="middle" fill="#7a5a00">VideoJob, estados, invariantes. Zero framework</text>

  <rect x="40" y="286" width="370" height="52" rx="4" fill="#f2f2f2" stroke="#666"/>
  <text x="225" y="306" font-size="12" font-weight="600" text-anchor="middle">Infra / outbound adapters</text>
  <text x="225" y="324" font-size="10" text-anchor="middle" fill="#555">FFmpeg, disco, fila, SMTP. Implementam portas</text>

  <text x="225" y="362" font-size="10.5" text-anchor="middle" fill="#1f4e79">Dependencias apontam para DENTRO</text>

  <!-- right: collapsed blob -->
  <rect x="480" y="96" width="390" height="242" rx="6" fill="#ffd9d9" stroke="#8b0000" stroke-width="1.6"/>
  <text x="675" y="124" font-size="13" font-weight="700" text-anchor="middle" fill="#6b0000">package main, um unico bloco</text>
  <text x="675" y="148" font-size="11" text-anchor="middle" fill="#5a1010">getHTMLForm()  ·  apresentacao</text>
  <text x="675" y="168" font-size="11" text-anchor="middle" fill="#5a1010">handleVideoUpload()  ·  HTTP + orquestracao</text>
  <text x="675" y="188" font-size="11" text-anchor="middle" fill="#5a1010">processVideo()  ·  “caso de uso”</text>
  <text x="675" y="208" font-size="11" text-anchor="middle" fill="#5a1010">exec.Command(ffmpeg)  ·  infraestrutura</text>
  <text x="675" y="228" font-size="11" text-anchor="middle" fill="#5a1010">os.MkdirAll / Glob / zip  ·  persistencia</text>
  <text x="675" y="248" font-size="11" text-anchor="middle" fill="#5a1010">fmt.Printf  ·  observabilidade</text>
  <line x1="510" y1="268" x2="840" y2="268" stroke="#c0392b" stroke-dasharray="4 3"/>
  <text x="675" y="290" font-size="11" font-weight="600" text-anchor="middle" fill="#8b0000">Dominio: ausente  ·  portas: zero</text>
  <text x="675" y="312" font-size="10.5" text-anchor="middle" fill="#8b0000">Dependencias apontam para FORA (os/exec, gin, html)</text>
  <text x="675" y="328" font-size="10.5" text-anchor="middle" fill="#5a1010">Padrao interno: Transaction Script (Fowler)</text>

  <!-- bottom verdict -->
  <rect x="40" y="384" width="830" height="118" rx="5" fill="#fafafa" stroke="#888"/>
  <text x="56" y="408" font-size="12" font-weight="700" fill="#111">Veredito de estilo</text>
  <text x="56" y="430" font-size="11" fill="#333">Deploy: monolitico (aceitavel). Interior: nao e monolitico modular, nao e Clean Architecture, nao e hexagonal, nao e em camadas.</text>
  <text x="56" y="450" font-size="11" fill="#333">O que falta nao e “quebrar em microsservicos”. E criar fronteiras (dominio, portas, adaptadores) dentro do mesmo deploy, ou no maximo separar API e worker quando o caso de uso ja estiver isolado.</text>
  <text x="56" y="470" font-size="11" fill="#333">Critica principal: o nucleo (processVideo) e a funcao mais acoplada a infraestrutura. Em Clean Architecture, essa funcao nao poderia importar os/exec.</text>
  <text x="56" y="490" font-size="10.5" fill="#666">Referencias de curso: Clean Architecture (Uncle Bob) · Transaction Script vs Domain Model (Fowler) · monolitico modular da Fase 3 da oficina.</text>
</svg>
