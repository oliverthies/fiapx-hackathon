  <text x="58" y="104" font-size="10" text-anchor="end" fill="#444">500</text>
  <text x="58" y="64" font-size="10" text-anchor="end" fill="#444">600</text>

  <g fill="#c0392b">
    <rect x="124" y="295" width="18" height="5"/>
