<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="20" y="24" font-size="14" font-weight="700" fill="#111">CPU do container durante 5 processamentos sequenciais (amostragem docker stats, ~2 s)</text>
  <text x="20" y="42" font-size="11" fill="#666">13:20:35 a 13:21:36 · 6 vCPU = 600% · fonte: docs/evidence/19-stats-curva.csv</text>

  <line x1="66" y1="300" x2="878" y2="300" stroke="#333" stroke-width="1.2"/>
  <line x1="66" y1="60" x2="66" y2="300" stroke="#333" stroke-width="1.2"/>

  <line x1="66" y1="60" x2="878" y2="60" stroke="#8b0000" stroke-width="1.4" stroke-dasharray="6 3"/>
  <text x="72" y="56" font-size="10" font-weight="700" fill="#8b0000">600%: saturação total da máquina (6 vCPU)</text>

  <line x1="66" y1="260" x2="878" y2="260" stroke="#2e7d32" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="72" y="256" font-size="10" fill="#2e7d32">100%: um núcleo (fase de compactação do ZIP)</text>

  <text x="58" y="304" font-size="10" text-anchor="end" fill="#444">0%</text>
  <text x="58" y="264" font-size="10" text-anchor="end" fill="#444">100</text>
  <text x="58" y="224" font-size="10" text-anchor="end" fill="#444">200</text>
  <text x="58" y="184" font-size="10" text-anchor="end" fill="#444">300</text>
